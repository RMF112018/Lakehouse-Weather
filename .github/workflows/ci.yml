name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  scaffold-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Validate shell and compose structure
        run: ./scripts/validate.sh
      - name: Run Python structural tests
        run: python tests/test_structure.py
